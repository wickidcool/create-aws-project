name: CI

# Runs on every push and pull request.
#
# The packaging job is the one that matters most for this repo: it catches
# dependency-declaration mistakes at the commit that introduces them, rather
# than after a user hits them via npx.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

  packaging:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Pack tarball
        id: pack
        run: |
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Installs the packed tarball into a scratch directory that has no
      # relationship to this checkout, then runs the CLI. A devDependency
      # imported by runtime code fails here and nowhere else.
      - name: Install tarball into a scratch project and run the CLI
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          cp "${{ steps.pack.outputs.tarball }}" "$SMOKE/"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "./${{ steps.pack.outputs.tarball }}" --no-audit --no-fund --loglevel=error
          ./node_modules/.bin/create-aws-project --version
          ./node_modules/.bin/create-aws-project --help > /dev/null

      # Cross-checks every bare import in the build output against the
      # dependencies block. Catches the problem class directly, and reports
      # every offender at once rather than failing on whichever import the
      # CLI happens to reach first.
      - name: Audit runtime imports against declared dependencies
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const deps = new Set(Object.keys(pkg.dependencies || {}));
          const dev = new Set(Object.keys(pkg.devDependencies || {}));

          // Directories inside the build output that ship as template content
          // or compiled tests rather than executable runtime code.
          const IGNORED_DIRS = ['__tests__', 'templates'];

          const walk = (dir) =>
            fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                return IGNORED_DIRS.includes(entry.name) ? [] : walk(full);
              }
              return entry.name.endsWith('.js') ? [full] : [];
            });

          const problems = [];
          for (const file of walk('dist')) {
            const src = fs.readFileSync(file, 'utf8');
            const pattern = /(?:from|import)\s*\(?\s*['"]([^'"./][^'"]*)['"]/g;
            for (const [, spec] of src.matchAll(pattern)) {
              if (spec.startsWith('node:')) continue;
              const name = spec.startsWith('@')
                ? spec.split('/').slice(0, 2).join('/')
                : spec.split('/')[0];
              if (deps.has(name)) continue;
              try {
                if (require.resolve(name) === name) continue; // node builtin
              } catch { /* not resolvable as a builtin */ }
              const reason = dev.has(name)
                ? 'declared only as a devDependency'
                : 'not declared at all';
              problems.push(`${file}: imports "${name}" (${reason})`);
            }
          }

          if (problems.length > 0) {
            console.error('Runtime imports missing from "dependencies":\n');
            for (const p of [...new Set(problems)]) console.error('  ' + p);
            console.error('\nMove these into dependencies, or stop importing them from shipped code.');
            process.exit(1);
          }
          console.log('All runtime imports are declared as dependencies.');
          EOF